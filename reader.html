<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-font="serif">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>阅读</title>
    <link rel="icon" href="icon.png" />
    <!-- ★ 主界面设计令牌：阅读窗口与主程序同一套视觉语言 -->
    <link rel="stylesheet" href="theme.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: var(--font-ui);
            background: var(--bg);
            color: var(--tx);
            font-weight: var(--fw-body);
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ---------- 标题栏（可拖动） ---------- */
        .rd-titlebar {
            height: 40px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 12px;
            background: var(--side);
            border-bottom: 1px solid var(--line);
            -webkit-app-region: drag;
        }
        .rd-titlebar .t {
            font-family: var(--font-title);
            font-size: var(--fs-h3);
            font-weight: var(--fw-title);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 42vw;
        }
        /* 品牌标：和主界面/任务栏同一个 systemoebook 图标 */
        .rd-brand { display: flex; align-items: center; gap: 7px; flex-shrink: 0; }
        .rd-brand img {
            width: 20px; height: 20px; border-radius: 5px;
            box-shadow: 0 1px 4px rgba(0,0,0,.45);
        }
        .rd-brand span {
            font-size: var(--fs-body);
            font-weight: var(--fw-strong);
            letter-spacing: .02em;
            color: var(--tx);
            white-space: nowrap;
        }
        .rd-titlebar .bar-sep { width: 1px; height: 16px; background: var(--line2); flex-shrink: 0; }
        .rd-titlebar .a {
            font-size: var(--fs-sm);
            color: var(--tx3);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .rd-titlebar .chap {
            flex: 1;
            min-width: 0;
            text-align: right;
            font-size: var(--fs-sm);
            color: var(--tx3);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .rd-titlebar .no-drag, .rd-titlebar button { -webkit-app-region: no-drag; }

        .lang-switch {
            display: flex;
            gap: 2px;
            padding: 2px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            flex-shrink: 0;
        }
        .lang-switch > div {
            font-size: var(--fs-label);
            line-height: 1;
            padding: 5px 8px;
            border-radius: 6px;
            color: var(--tx3);
            cursor: pointer;
            user-select: none;
            transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
        }
        .lang-switch > div:hover { color: var(--tx); }
        .lang-switch > div.on { background: var(--acc-bg); border: 1px solid var(--acc-line); color: var(--acc); padding: 4px 7px; }

        .win-ctrl { display: flex; gap: 2px; }
        .win-ctrl button {
            width: 30px; height: 26px;
            border: none; background: transparent;
            color: var(--tx3); cursor: pointer;
            border-radius: 7px; font-size: 13px; line-height: 1;
            display: flex; align-items: center; justify-content: center;
            transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
        }
        .win-ctrl button:hover { background: var(--card2); color: var(--tx); }
        .win-ctrl button.close:hover { background: var(--danger); color: #fff; }

        /* ---------- 工具条 ---------- */
        .rd-tools {
            height: 46px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0 12px;
            background: var(--panel);
            border-bottom: 1px solid var(--line);
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: thin;
            scrollbar-color: var(--line2) transparent;
        }
        /* 工具条在窄窗口下会横向溢出：留一条 6px 细滚动条，让右边被挡住的按钮
           可发现、也能用鼠标拖。2026-09-24 用户反馈「有些功能被挡住了」；
           滚轮映射成横向滚动见 reader.js 的 bindToolsWheel()。 */
        .rd-tools::-webkit-scrollbar { height: 6px; }
        .rd-tools::-webkit-scrollbar-track { background: transparent; }
        .rd-tools::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 3px; }
        .rd-tools::-webkit-scrollbar-thumb:hover { background: var(--tx4); }
        .rd-sep { width: 1px; height: 20px; background: var(--line); flex-shrink: 0; margin: 0 2px; }
        .rd-grp { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
        .rd-tools button {
            border: 1px solid transparent;
            background: transparent;
            color: var(--tx2);
            font-family: inherit;
            font-size: var(--fs-sm);
            border-radius: 8px;
            padding: 6px 9px;
            cursor: pointer;
            white-space: nowrap;
            display: flex; align-items: center; gap: 5px;
            transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
        }
        .rd-tools button:hover { background: var(--card2); color: var(--tx); }
        .rd-tools button.on { background: var(--acc-bg); border-color: var(--acc-line); color: var(--acc); }
        .rd-tools button.icon { padding: 6px 8px; font-size: 14px; }
        .rd-tools .rd-val {
            font-family: var(--font-mono);
            font-size: var(--fs-sm);
            color: var(--tx3);
            min-width: 34px;
            text-align: center;
            flex-shrink: 0;
        }
        .rd-tools input[type=range] {
            width: 74px; accent-color: var(--acc); flex-shrink: 0;
        }
        .rd-tools .lbl { font-size: var(--fs-label); color: var(--tx4); letter-spacing: .3px; flex-shrink: 0; }

        /* ---------- 主体 ---------- */
        .rd-body { flex: 1; display: flex; min-height: 0; }
        .rd-side {
            width: 290px;
            flex-shrink: 0;
            background: var(--side);
            border-right: 1px solid var(--line);
            display: none;
            flex-direction: column;
            min-height: 0;
        }
        .rd-side.show { display: flex; }
        .rd-tabs {
            display: flex;
            align-items: center;
            gap: 2px;
            padding: 8px 10px 6px;
            border-bottom: 1px solid var(--line);
            flex-shrink: 0;
        }
        .rd-side-x {
            border: none; background: transparent; color: var(--tx4);
            font-size: 15px; line-height: 1; cursor: pointer; padding: 2px 5px;
            border-radius: 6px; flex-shrink: 0;
        }
        .rd-side-x:hover { background: var(--card2); color: var(--tx); }
        .rd-tab {
            text-align: center;
            font-size: var(--fs-sm);
            color: var(--tx3);
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            user-select: none;
        }
        .rd-tab:hover { color: var(--tx); background: var(--card); }
        .rd-tab.on { background: var(--acc-bg); color: var(--acc); }
        .rd-side .cnt { font-size: var(--fs-label); color: var(--tx4); padding: 6px 12px 4px; flex-shrink: 0; }
        .rd-toc-list { flex: 1; overflow-y: auto; padding: 0 6px 10px; }
        .rd-toc-i {
            padding: 7px 9px;
            border-radius: 8px;
            font-size: var(--fs-body);
            color: var(--tx2);
            cursor: pointer;
            line-height: 1.35;
            border: 1px solid transparent;
        }
        .rd-toc-i:hover { background: var(--card); color: var(--tx); }
        .rd-toc-i.d1 { padding-left: 20px; font-size: var(--fs-sm); }
        .rd-toc-i.d2 { padding-left: 32px; font-size: var(--fs-sm); color: var(--tx3); }
        .rd-toc-i.d3 { padding-left: 42px; font-size: var(--fs-sm); color: var(--tx3); }
        .rd-toc-i.cur { background: var(--acc-bg); border-color: var(--acc-line); color: var(--acc); }
        .rd-toc-t { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .rd-bm-i {
            display: flex; align-items: center; gap: 8px;
            padding: 8px 10px; border-radius: 8px; cursor: pointer;
            border: 1px solid var(--line);
            background: var(--card);
            margin-bottom: 6px;
        }
        .rd-bm-i:hover { border-color: var(--acc-line); background: var(--acc-bg); }
        .rd-bm-t { flex: 1; font-size: var(--fs-body); color: var(--tx2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .rd-bm-x { color: var(--tx4); font-size: 11px; padding: 0 2px; }
        .rd-bm-x:hover { color: var(--danger); }
        .rd-empty { padding: 26px 14px; text-align: center; font-size: var(--fs-sm); color: var(--tx4); line-height: 1.7; }

        /* ---------- 搜索面板 ---------- */
        .rd-sr {
            width: 340px;
            flex-shrink: 0;
            background: var(--side);
            border-right: 1px solid var(--line);
            display: none;
            flex-direction: column;
            min-height: 0;
        }
        .rd-sr.show { display: flex; }
        .rd-sr-head { display: flex; gap: 6px; padding: 10px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
        .rd-sr-head input {
            flex: 1; min-width: 0;
            background: var(--field);
            border: 1px solid var(--line);
            border-radius: 8px;
            color: var(--tx);
            font-family: inherit;
            font-size: var(--fs-body);
            padding: 7px 10px;
            outline: none;
        }
        .rd-sr-head input:focus { border-color: var(--acc); box-shadow: 0 0 0 3px rgba(79,209,197,.12); }
        .rd-sr-head button {
            border: none; border-radius: 8px; cursor: pointer; font-family: inherit;
            background: linear-gradient(135deg, #4FD1C5, #2AA79C); color: #04211E;
            font-size: var(--fs-body); font-weight: var(--fw-strong); padding: 7px 12px;
        }
        .rd-sr-head button.ghost { background: var(--card2); color: var(--tx); border: 1px solid var(--line2); padding: 7px 9px; }
        .rd-sr-prog { font-size: var(--fs-label); color: var(--acc); padding: 4px 12px; flex-shrink: 0; }
        .rd-sr-list { flex: 1; overflow-y: auto; padding: 4px 8px 10px; }
        .rd-sr-i { padding: 8px 10px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
        .rd-sr-i:hover { background: var(--card); border-color: var(--line); }
        .rd-sr-l { font-size: var(--fs-label); color: var(--tx4); margin-bottom: 3px; }
        .rd-sr-x { font-size: var(--fs-body); color: var(--tx2); line-height: 1.5; }
        .rd-sr-x em { color: var(--acc); font-style: normal; font-weight: var(--fw-strong); background: var(--acc-bg); border-radius: 3px; padding: 0 2px; }

        /* ---------- 阅读区 ---------- */
        .rd-main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
        .rd-pane { flex: 1; min-height: 0; position: relative; overflow: hidden; }
        foliate-view { display: block; width: 100%; height: 100%; }

        .rd-foot {
            height: 34px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 14px;
            background: var(--panel);
            border-top: 1px solid var(--line);
        }
        .rd-foot .bar { flex: 1; height: 3px; background: var(--card2); border-radius: 2px; overflow: hidden; }
        .rd-foot .bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #4FD1C5, #2AA79C); transition: width .18s ease; }
        .rd-foot .pct { font-family: var(--font-mono); font-size: var(--fs-sm); color: var(--tx3); min-width: 38px; text-align: right; }
        .rd-foot button {
            border: 1px solid var(--line); background: var(--card); color: var(--tx2);
            border-radius: 8px; padding: 4px 10px; font-family: inherit; font-size: var(--fs-sm); cursor: pointer;
        }
        .rd-foot button:hover { border-color: var(--acc-line); color: var(--acc); }

        /* ---------- 加载遮罩 ---------- */
        .rd-loading {
            position: absolute; inset: 0; z-index: 20;
            background: var(--bg);
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
            font-size: var(--fs-body); color: var(--tx2);
        }
        .rd-spin {
            width: 26px; height: 26px; border-radius: 50%;
            border: 2px solid var(--line2); border-top-color: var(--acc);
            animation: rdspin .8s linear infinite;
        }
        @keyframes rdspin { to { transform: rotate(360deg); } }
        .rd-kbd { font-size: var(--fs-label); color: var(--tx4); text-align: center; line-height: 1.9; }
        .rd-kbd b { color: var(--tx3); font-weight: var(--fw-ui); }
    </style>
</head>
<body>
    <div class="rd-titlebar">
        <span class="rd-brand" title="systemoebook">
            <img src="icon.png" alt="" />
            <span>systemoebook</span>
        </span>
        <span class="bar-sep"></span>
        <span class="t" id="rdTitle" data-i18n="EasyPub 阅读">EasyPub 阅读</span>
        <span class="a" id="rdAuthor"></span>
        <span class="chap" id="rdChap"></span>
        <div class="lang-switch no-drag" id="pageLangSwitch">
            <div data-lang="zh" class="on">中文</div>
            <div data-lang="en">EN</div>
        </div>
        <div class="win-ctrl">
            <button id="btnMin" title="—">–</button>
            <button id="btnMax" title="□">□</button>
            <button id="btnClose" class="close" title="✕">✕</button>
        </div>
    </div>

    <div class="rd-tools">
        <button id="btnToc" class="icon" title="目录" data-i18n-title="目录">☰</button>
        <button id="btnBm" class="icon" title="书签" data-i18n-title="书签">🔖</button>
        <button id="btnSearch" class="icon" title="搜索" data-i18n-title="搜索">🔍</button>
        <span class="rd-sep"></span>

        <span class="lbl" data-i18n="主题">主题</span>
        <div class="rd-grp">
            <button data-set="theme" data-val="dark" data-i18n="深色">深色</button>
            <button data-set="theme" data-val="light" data-i18n="浅色">浅色</button>
            <button data-set="theme" data-val="sepia" data-i18n="护眼">护眼</button>
        </div>
        <span class="rd-sep"></span>

        <span class="lbl" data-i18n="字体">字体</span>
        <div class="rd-grp">
            <button data-set="font" data-val="serif" data-i18n="宋体">宋体</button>
            <button data-set="font" data-val="sans" data-i18n="黑体">黑体</button>
        </div>
        <span class="rd-sep"></span>

        <span class="lbl" data-i18n="字号">字号</span>
        <button id="btnMinus" class="icon">A－</button>
        <span class="rd-val" id="rdSizeVal">20px</span>
        <button id="btnPlus" class="icon">A＋</button>
        <span class="rd-sep"></span>

        <span class="lbl" data-i18n="行距">行距</span>
        <input type="range" id="rdLh" min="1.2" max="2.4" step="0.1" value="1.9" />
        <span class="rd-val" id="rdLhVal">1.9</span>
        <span class="rd-sep"></span>

        <span class="lbl" data-i18n="翻页">翻页</span>
        <div class="rd-grp">
            <button data-set="flow" data-val="paginated" data-i18n="翻页「仿真」">翻页</button>
            <button data-set="flow" data-val="scrolled" data-i18n="滚动">滚动</button>
        </div>
        <span class="rd-sep"></span>

        <span class="lbl" data-i18n="边距">边距</span>
        <div class="rd-grp">
            <button data-set="margins" data-val="narrow" data-i18n="窄">窄</button>
            <button data-set="margins" data-val="normal" data-i18n="标准">标准</button>
            <button data-set="margins" data-val="wide" data-i18n="宽">宽</button>
        </div>
        <span class="rd-sep"></span>

        <span class="lbl" data-i18n="对齐">对齐</span>
        <div class="rd-grp">
            <button data-set="align" data-val="start" data-i18n="左对齐">左对齐</button>
            <button data-set="align" data-val="justify" data-i18n="两端对齐">两端对齐</button>
        </div>
        <span class="rd-sep"></span>

        <button id="btnAddBm" data-i18n="⭐ 添加书签">⭐ 添加书签</button>
    </div>

    <div class="rd-body">
        <aside class="rd-side" id="rdToc">
            <div class="rd-tabs">
                <div class="rd-tab on" data-tab="toc" data-i18n="目录">目录</div>
                <div class="rd-tab" data-tab="bm" data-i18n="书签">书签</div>
                <div class="rd-tab" data-tab="sr" data-i18n="搜索">搜索</div>
                <button class="rd-side-x" id="rdTocClose" title="关闭" data-i18n-title="关闭">✕</button>
            </div>
            <div class="cnt" id="rdTocCount"></div>
            <div class="rd-toc-list" id="rdTocList"></div>
            <div class="rd-toc-list" id="rdBmList" style="display:none"></div>
        </aside>

        <aside class="rd-sr" id="rdSrPanel">
            <div class="rd-sr-head">
                <input type="text" id="rdSrInput" placeholder="搜索全书…" data-i18n-ph="搜索全书…" />
                <button id="rdSrGo" data-i18n="搜索">搜索</button>
                <button id="rdSrClose" class="ghost">✕</button>
            </div>
            <div class="rd-sr-prog" id="rdSrProg"></div>
            <div class="rd-sr-list" id="rdSrList">
                <div class="rd-empty" data-i18n="输入关键词后回车">输入关键词后回车</div>
            </div>
        </aside>

        <main class="rd-main">
            <div class="rd-pane" id="rdPane"></div>
            <div class="rd-foot">
                <button id="btnPrev" data-i18n="上一页">‹</button>
                <button id="btnNext" data-i18n="下一页">›</button>
                <div class="bar"><i id="rdBar"></i></div>
                <span class="pct" id="rdPct">0%</span>
            </div>
            <div class="rd-loading" id="rdLoading">
                <div class="rd-spin"></div>
                <div id="rdLoadingTxt" data-i18n="正在解析书籍…">正在解析书籍…</div>
                <div class="rd-kbd">
                    <b>空格 / →</b> <span data-i18n="下一页">下一页</span> ·
                    <b>←</b> <span data-i18n="上一页">上一页</span> ·
                    <b>点右侧</b> <span data-i18n="翻页">翻页</span> ·
                    <b>+ −</b> <span data-i18n="字号">字号</span> ·
                    <b>Esc</b> <span data-i18n="关闭">关闭</span>
                </div>
            </div>
        </main>
    </div>

    <script src="i18n-popups.js"></script>
    <script type="module" src="reader.js"></script>
</body>
</html>
